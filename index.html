<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Video Prompt Generator</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#0b1020;color:#eef2ff}.container{max-width:1100px;margin:auto;padding:18px}.card{background:#121a2d;border:1px solid #293653;border-radius:16px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{display:block;font-weight:700;margin-bottom:6px}textarea,input,select{width:100%;background:#0d1425;color:#fff;border:1px solid #354362;border-radius:10px;padding:10px;font:inherit}textarea{min-height:90px}.chips{display:flex;flex-wrap:wrap;gap:6px;max-height:190px;overflow:auto}.chip{border:1px solid #354362;background:#0d1425;color:#fff;border-radius:999px;padding:7px 9px}.chip.active{background:#526ed4}.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;background:#5875e8;color:#fff}.secondary{background:#293653}.readonly{background:#080d18}small{color:#9aa8c8}@media(max-width:720px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><main class="container"><h1>🎬 AI Video Prompt Generator</h1><p>14 kolom → AI → Prompt Indonesia editable + English final.</p><form id="f"><div class="card"><div class="grid"><div><label>1. Subjek</label><textarea id="subjek"></textarea></div><div><label>2. Aksi</label><textarea id="aksi"></textarea></div><div><label>3. Ekspresi</label><textarea id="ekspresi"></textarea></div><div><label>4. Tempat</label><textarea id="tempat"></textarea></div><div><label>5. Waktu</label><div class="chips" id="time"></div><input id="customTime" placeholder="Waktu custom"></div><div class="full"><label>6. Gerakan Kamera <small>(multi-pilih)</small></label><div class="chips" id="camera"></div></div><div><label>7. Pencahayaan</label><div class="chips" id="lighting"></div></div><div><label>8. Gaya Video</label><div class="chips" id="style"></div></div><div><label>9. Suasana Video</label><div class="chips" id="mood"></div></div><div><label>10. Aspect Ratio</label><select id="ratio"></select></div><div><label>11. Suara / Musik</label><textarea id="audio"></textarea></div><div><label>12. Kalimat yang Diucapkan</label><textarea id="dialogue"></textarea></div><div><label>13. Bahasa yang Diucapkan</label><select id="language"></select></div><div class="full"><label>14. Detail Tambahan</label><textarea id="details" placeholder="Kontinuitas karakter/produk, logo, tekstur, background, larangan bokeh, dll."></textarea></div></div></div><div class="card"><div class="actions"><button>⚡ GENERATE PROMPT</button><button type="button" class="secondary" id="local">Generate Lokal</button><button type="button" class="secondary" id="reset">Reset</button></div><p id="status"></p></div></form><div class="card"><label>🇮🇩 Prompt Bahasa Indonesia — Editable</label><textarea id="indo"></textarea><button type="button" class="secondary" onclick="copy('indo')">Copy Indonesia</button></div><div class="card"><label>🇬🇧 Final English Prompt — Locked</label><textarea id="eng" readonly class="readonly"></textarea><button type="button" class="secondary" onclick="copy('eng')">Copy English</button></div></main><script src="options.js"></script><script>const $=x=>document.getElementById(x);function chips(id,a,m=true){a.forEach(v=>{let b=document.createElement('button');b.type='button';b.className='chip';b.textContent=Array.isArray(v)?v[0]+' ('+v[1]+')':v;b.dataset.v=Array.isArray(v)?v[0]:v;b.onclick=()=>{if(!m)[...$(id).children].forEach(x=>x.classList.remove('active'));b.classList.toggle('active')};$(id).appendChild(b)})}function vals(id){return [...$(id).querySelectorAll('.active')].map(x=>x.dataset.v)}chips('time',OPTIONS.time,false);chips('camera',OPTIONS.camera);chips('lighting',OPTIONS.lighting);chips('style',OPTIONS.style);chips('mood',OPTIONS.mood);OPTIONS.ratio.forEach(x=>{let o=document.createElement('option');o.textContent=x;o.value=x;$('ratio').appendChild(o)});OPTIONS.language.forEach(x=>{let o=document.createElement('option');o.textContent=x;o.value=x;$('language').appendChild(o)});function brief(){return{subjek:$('subjek').value,aksi:$('aksi').value,ekspresi:$('ekspresi').value,tempat:$('tempat').value,waktu:[...vals('time'),$('customTime').value].filter(Boolean),gerakan_kamera:vals('camera'),pencahayaan:vals('lighting'),gaya_video:vals('style'),suasana_video:vals('mood'),aspect_ratio:$('ratio').value,suara_musik:$('audio').value,kalimat_diucapkan:$('dialogue').value,bahasa_diucapkan:$('language').value,detail_tambahan:$('details').value}}$('f').onsubmit=async e=>{e.preventDefault();$('status').textContent='AI sedang menyusun...';try{let r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(brief())}),d=await r.json();if(!r.ok)throw Error(d.error);$('indo').value=d.indonesia;$('eng').value=d.english;$('status').textContent='Selesai.'}catch(x){$('status').textContent='Gagal: '+x.message}};$('local').onclick=()=>{let b=brief();$('indo').value=`Buat video ${b.aspect_ratio}. Subjek: ${b.subjek}. Aksi: ${b.aksi}. Ekspresi: ${b.ekspresi}. Tempat: ${b.tempat}. Waktu: ${b.waktu.join(', ')}. Kamera: ${b.gerakan_kamera.join(', ')}. Pencahayaan: ${b.pencahayaan.join(', ')}. Gaya: ${b.gaya_video.join(', ')}. Suasana: ${b.suasana_video.join(', ')}. Suara/musik: ${b.suara_musik}. Kalimat: "${b.kalimat_diucapkan}". Bahasa: ${b.bahasa_diucapkan}. Detail: ${b.detail_tambahan}. Kembangkan menjadi prompt video sinematik yang detail, realistis, konsisten, dan siap produksi.`};$('reset').onclick=()=>location.reload();function copy(id){navigator.clipboard.writeText($(id).value);$('status').textContent='Berhasil disalin.'}</script></body></html>
